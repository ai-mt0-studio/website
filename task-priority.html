<script>
  // 4象限の定義（アイコン・色・見出し・優先順位）
  const QUADRANTS = {
    now:      { label: '今すぐやる',     sub: '緊急かつ重要',           icon: '🔥', color: '#ef4444', order: 1 },
    plan:     { label: '計画してやる',   sub: '重要だが緊急でない',     icon: '📅', color: '#2a78d6', order: 2 },
    delegate: { label: '人に任せる',     sub: '緊急だが重要でない',     icon: '🤝', color: '#eb9a34', order: 3 },
    drop:     { label: 'やらなくていい', sub: '緊急でも重要でもない',   icon: '🗑', color: '#6b7280', order: 4 }
  };

  const STORAGE_KEY = 'aimt0-task-priority-tasks';

  let tasks = [];
  let nextId = 1;
  let activeView = 'matrix';

  // ── ブラウザへの自動保存 ──
  // 将来的に会員登録アカウントとの連携保存に対応する場合は、
  // この save/load の中身を API 呼び出しに差し替えるだけで済むようにしてある。
  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, nextId }));
    } catch (e) { /* 保存できない環境（プライベートモード等）では無視 */ }
  }
  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!Array.isArray(data.tasks)) return false;
      tasks = data.tasks;
      nextId = data.nextId || (tasks.reduce((m, t) => Math.max(m, t.id), 0) + 1);
      return true;
    } catch (e) { return false; }
  }

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── タスクがどの象限に属するかを判定 ──
  function getQuadrantKey(task) {
    if (task.urgent && task.important) return 'now';
    if (!task.urgent && task.important) return 'plan';
    if (task.urgent && !task.important) return 'delegate';
    return 'drop';
  }

  // ── タスクの追加・削除 ──
  function addTask() {
    const nameEl = document.getElementById('taskName');
    const name = nameEl.value.trim();
    const urgent = document.getElementById('taskUrgent').value === '1';
    const important = document.getElementById('taskImportant').value === '1';

    if (!name) { alert('タスク名を入力してください'); return; }

    tasks.push({ id: nextId++, name, urgent, important });
    nameEl.value = '';
    nameEl.focus();

    saveToStorage();
    renderAll();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveToStorage();
    renderAll();
  }

  // ── 登録済みタスク一覧 ──
  function renderTaskList() {
    const area = document.getElementById('taskListArea');
    document.getElementById('taskCount').textContent = tasks.length;
    if (tasks.length === 0) {
      area.innerHTML = '<div class="empty-note">まだタスクが登録されていません</div>';
      return;
    }
    area.innerHTML = tasks.map(t => {
      const q = QUADRANTS[getQuadrantKey(t)];
      return `
        <div class="task-item">
          <span class="task-dot" style="background:${q.color}"></span>
          <div class="task-item-body">
            <div class="task-item-title">${esc(t.name)}</div>
            <div class="task-item-meta">
              <span>緊急度：${t.urgent ? '高' : '低'}</span>
              <span>重要度：${t.important ? '高' : '低'}</span>
            </div>
          </div>
          <span class="task-item-tag">${q.icon} ${q.label}</span>
          <button class="btn-remove" onclick="deleteTask(${t.id})" title="削除">×</button>
        </div>`;
    }).join('');
  }

  // ── 表示切り替え ──
  function setView(v) {
    activeView = v;
    document.getElementById('tabMatrix').classList.toggle('active', v === 'matrix');
    document.getElementById('tabList').classList.toggle('active', v === 'list');
    document.getElementById('matrixView').style.display = v === 'matrix' ? 'block' : 'none';
    document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
    renderAll();
  }

  // ── マトリクス描画 ──
  function renderQuadrantGrid() {
    const grouped = { now: [], plan: [], delegate: [], drop: [] };
    tasks.forEach(t => grouped[getQuadrantKey(t)].push(t));

    const html = Object.keys(QUADRANTS).map(key => {
      const q = QUADRANTS[key];
      const items = grouped[key];
      const tasksHtml = items.length
        ? items.map(t => `<div class="quadrant-task"><span class="quadrant-task-name">${esc(t.name)}</span></div>`).join('')
        : '<div class="empty-note">タスクはありません</div>';
      return `
        <div class="quadrant-card q-${key}">
          <div class="quadrant-head">
            <span class="quadrant-icon">${q.icon}</span>
            <span class="quadrant-name">${q.label}</span>
            <span class="quadrant-count">${items.length}件</span>
          </div>
          <div class="quadrant-sub">${q.sub}</div>
          ${tasksHtml}
        </div>`;
    }).join('');

    document.getElementById('quadrantGridArea').innerHTML = html;
  }

  // ── 優先順位リスト描画 ──
  function renderPriorityList() {
    const area = document.getElementById('priorityListArea');
    if (tasks.length === 0) {
      area.innerHTML = '<div class="list-empty">まだタスクが登録されていません。上のフォームからタスクを追加してください。</div>';
      return;
    }

    const grouped = { now: [], plan: [], delegate: [], drop: [] };
    tasks.forEach(t => grouped[getQuadrantKey(t)].push(t));

    const orderedKeys = Object.keys(QUADRANTS).sort((a, b) => QUADRANTS[a].order - QUADRANTS[b].order);

    area.innerHTML = orderedKeys.map(key => {
      const q = QUADRANTS[key];
      const items = grouped[key];
      if (items.length === 0) return '';
      const rowsHtml = items.map(t => `
        <div class="priority-row">
          <span class="priority-row-name">${esc(t.name)}</span>
          <span class="priority-row-meta">緊急度：${t.urgent ? '高' : '低'} ／ 重要度：${t.important ? '高' : '低'}</span>
        </div>`).join('');
      return `
        <div class="priority-group">
          <div class="priority-group-head">
            <span class="priority-rank" style="background:${q.color}">${q.order}</span>
            <span>${q.icon} ${q.label}（${q.sub}）</span>
          </div>
          ${rowsHtml}
        </div>`;
    }).join('');
  }

  function renderAll() {
    renderTaskList();
    if (activeView === 'matrix') renderQuadrantGrid();
    else renderPriorityList();
  }

  // ── リセット ──
  function resetAll() {
    if (!confirm('登録したタスクをすべてリセットしますか？（このブラウザの保存データも削除されます）')) return;
    tasks = [];
    saveToStorage();
    renderAll();
  }

  // ── 初期化（保存データがあれば復元、なければ空の状態で開始） ──
  function initDefaults() {
    loadFromStorage();
    renderAll();
  }

  initDefaults();
</script>
</body>
</html>
