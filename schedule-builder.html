<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
  <header>
    <a href="tools.html" style="font-size:0.8rem;opacity:0.7;text-decoration:none;display:inline-block;margin-bottom:0.5rem;color:inherit;">← ツール一覧へ戻る</a>
    <h1>📅 スケジュール表作成ツール</h1>
    <p>予定を入力するだけで、シフト表形式・スケジュール帳形式を切り替えて表示できます</p>
    <div class="free-badge">✅ 完全無料 · 登録不要 · 外部AI API不要</div>
  </header>

  <!-- 予定を追加 -->
  <div class="card">
    <div class="label"><div class="label-bar"></div>予定を追加</div>
    <div class="form-grid">
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>タイトル</label>
        <input type="text" id="evTitle" placeholder="例：早番シフト、歯医者、プロジェクト会議" />
      </div>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="evDate" />
      </div>
      <div class="form-group">
        <label>開始時刻</label>
        <input type="time" id="evStart" value="09:00" />
      </div>
      <div class="form-group">
        <label>終了時刻</label>
        <input type="time" id="evEnd" value="17:00" />
      </div>
      <div class="form-group">
        <label>カテゴリ</label>
        <select id="evCategory">
          <option value="work">仕事</option>
          <option value="private">プライベート</option>
          <option value="important">重要</option>
          <option value="other">その他</option>
        </select>
      </div>
    </div>

    <label class="recurring-toggle">
      <input type="checkbox" id="evRecurring" onchange="toggleRecurring()" />
      繰り返し予定にする（毎週◯曜日）
    </label>
    <div class="recurring-panel" id="recurringPanel">
      <div class="form-group" style="margin-bottom:0.85rem;">
        <label>繰り返す曜日（複数選択可）</label>
        <div class="weekday-pills" id="weekdayPills">
          <button type="button" class="wd-pill" data-day="0" onclick="toggleWeekday(0)">月</button>
          <button type="button" class="wd-pill" data-day="1" onclick="toggleWeekday(1)">火</button>
          <button type="button" class="wd-pill" data-day="2" onclick="toggleWeekday(2)">水</button>
          <button type="button" class="wd-pill" data-day="3" onclick="toggleWeekday(3)">木</button>
          <button type="button" class="wd-pill" data-day="4" onclick="toggleWeekday(4)">金</button>
          <button type="button" class="wd-pill" data-day="5" onclick="toggleWeekday(5)">土</button>
          <button type="button" class="wd-pill" data-day="6" onclick="toggleWeekday(6)">日</button>
        </div>
      </div>
      <div class="form-group">
        <label>繰り返し終了日</label>
        <input type="date" id="evRepeatUntil" />
      </div>
    </div>

    <button class="btn-add" onclick="addEvent()">＋ 予定を追加</button>
  </div>

  <!-- 登録済みの予定一覧 -->
  <div class="card">
    <div class="label"><div class="label-bar"></div>登録済みの予定（<span id="eventCount">0</span>件）</div>
    <div id="eventListArea"></div>
  </div>

  <!-- 集計 -->
  <div class="card">
    <div class="label"><div class="label-bar"></div>「仕事」の合計時間（自動集計）</div>
    <div class="agg-grid">
      <div>
        <div class="agg-col-title">📆 週間合計</div>
        <div id="aggWeekly"></div>
      </div>
      <div>
        <div class="agg-col-title">🗓 月間合計</div>
        <div id="aggMonthly"></div>
      </div>
    </div>
  </div>

  <!-- 表示切り替えタブ -->
  <div class="view-tabs">
    <button type="button" class="view-tab active" id="tabShift" onclick="setView('shift')">🗓 シフト表形式</button>
    <button type="button" class="view-tab" id="tabList" onclick="setView('list')">📋 スケジュール帳形式</button>
  </div>

  <!-- アクション -->
  <div class="action-bar">
    <button class="btn btn-primary" onclick="window.print()">🖨 印刷 / PDF保存</button>
    <button class="btn btn-danger btn-sm" onclick="resetAll()">🔄 全予定をリセット</button>
  </div>

  <!-- シフト表ビュー -->
  <div id="shiftView">
    <div class="preview-wrap">
      <span class="preview-badge">シフト表形式</span>
      <div class="preview-title">スケジュール表</div>
      <div class="week-nav">
        <button class="btn btn-outline btn-sm" onclick="shiftWeek(-1)">← 前週</button>
        <div class="week-label" id="weekRangeLabel"></div>
        <button class="btn btn-outline btn-sm" onclick="jumpToday()">今週</button>
        <button class="btn btn-outline btn-sm" onclick="shiftWeek(1)">次週 →</button>
      </div>
      <div class="grid-scroll">
        <div class="shift-grid" id="shiftGridArea"></div>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--cat-work)"></span>仕事</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--cat-private)"></span>プライベート</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--cat-important)"></span>重要</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--cat-other)"></span>その他</div>
        <div class="legend-item"><span class="legend-dot" style="background:rgba(148,163,184,0.35)"></span>空き時間</div>
      </div>
    </div>
  </div>

  <!-- スケジュール帳ビュー -->
  <div id="listView" style="display:none;">
    <div class="preview-wrap">
      <span class="preview-badge">スケジュール帳形式</span>
      <div class="preview-title">スケジュール表</div>
      <div id="scheduleListArea"></div>
    </div>
  </div>

  <!-- 導線 -->
  <div class="cta-row">
    <a href="tools.html" class="btn btn-primary cta-btn">無料ツールを使う →</a>
    <a href="register.html" class="btn btn-secondary cta-btn">無料会員登録する →</a>
    <a href="contact.html" class="btn btn-outline cta-btn">オーダーメイド相談する →</a>
  </div>
</div>

<script>
  const CATEGORIES = {
    work:      { label: '仕事',         color: '#2a78d6' },
    private:   { label: 'プライベート', color: '#1baf7a' },
    important: { label: '重要',         color: '#eb6834' },
    other:     { label: 'その他',       color: '#9c7bd6' }
  };
  const WD_LABELS = ['月','火','水','木','金','土','日'];
  const ROW_H = 26; // px per hour
  const PX_PER_MIN = ROW_H / 60;
  const TOTAL_H = 24 * ROW_H;

  let events = [];
  let nextId = 1;
  let selectedWeekdays = new Set();
  let activeView = 'shift';
  let currentWeekStart = getMonday(new Date());

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function getMonday(d) { const day = d.getDay(); const diff = (day + 6) % 7; return addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -diff); }
  function timeToMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
  function isSameDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function hexToRgba(hex, alpha) {
    const v = hex.replace('#', '');
    const r = parseInt(v.substring(0, 2), 16), g = parseInt(v.substring(2, 4), 16), b = parseInt(v.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ── 繰り返し設定 UI ──
  function toggleRecurring() {
    const on = document.getElementById('evRecurring').checked;
    document.getElementById('recurringPanel').style.display = on ? 'block' : 'none';
    if (on) {
      const dateVal = document.getElementById('evDate').value;
      if (dateVal && selectedWeekdays.size === 0) {
        const idx = (parseDateStr(dateVal).getDay() + 6) % 7;
        selectedWeekdays.add(idx);
        document.querySelector(`.wd-pill[data-day="${idx}"]`).classList.add('active');
      }
      const untilEl = document.getElementById('evRepeatUntil');
      if (!untilEl.value && dateVal) {
        untilEl.value = ymd(addDays(parseDateStr(dateVal), 56));
      }
    }
  }
  function toggleWeekday(i) {
    const btn = document.querySelector(`.wd-pill[data-day="${i}"]`);
    if (selectedWeekdays.has(i)) { selectedWeekdays.delete(i); btn.classList.remove('active'); }
    else { selectedWeekdays.add(i); btn.classList.add('active'); }
  }

  // ── 予定の追加・削除 ──
  function addEvent() {
    const title = document.getElementById('evTitle').value.trim();
    const date = document.getElementById('evDate').value;
    const start = document.getElementById('evStart').value;
    const end = document.getElementById('evEnd').value;
    const category = document.getElementById('evCategory').value;
    const recurring = document.getElementById('evRecurring').checked;

    if (!title) { alert('タイトルを入力してください'); return; }
    if (!date) { alert('日付を入力してください'); return; }
    if (!start || !end) { alert('開始・終了時刻を入力してください'); return; }
    if (timeToMin(end) <= timeToMin(start)) { alert('終了時刻は開始時刻より後の時刻にしてください'); return; }

    if (recurring) {
      if (selectedWeekdays.size === 0) { alert('繰り返す曜日を1つ以上選択してください'); return; }
      const repeatUntil = document.getElementById('evRepeatUntil').value;
      if (!repeatUntil) { alert('繰り返し終了日を入力してください'); return; }
      if (repeatUntil < date) { alert('繰り返し終了日は開始日以降にしてください'); return; }
      events.push({ id: nextId++, type: 'recurring', title, category, anchorDate: date, start, end, weekdays: [...selectedWeekdays], repeatUntil });
    } else {
      events.push({ id: nextId++, type: 'single', title, category, date, start, end });
    }

    document.getElementById('evTitle').value = '';
    document.getElementById('evRecurring').checked = false;
    document.getElementById('recurringPanel').style.display = 'none';
    selectedWeekdays.clear();
    document.querySelectorAll('.wd-pill').forEach(b => b.classList.remove('active'));
    document.getElementById('evRepeatUntil').value = '';

    renderAll();
  }

  function deleteEvent(id) {
    events = events.filter(e => e.id !== id);
    renderAll();
  }

  // ── 予定の展開（繰り返し予定を実際の日付に展開） ──
  function expandOccurrences(rangeStart, rangeEnd) {
    const out = [];
    events.forEach(ev => {
      if (ev.type === 'single') {
        const d = parseDateStr(ev.date);
        if (d >= rangeStart && d <= rangeEnd) {
          out.push({ sourceId: ev.id, title: ev.title, category: ev.category, date: d, start: ev.start, end: ev.end, recurring: false });
        }
      } else {
        const anchor = parseDateStr(ev.anchorDate);
        const until = parseDateStr(ev.repeatUntil);
        const start = anchor > rangeStart ? anchor : rangeStart;
        const stop = until < rangeEnd ? until : rangeEnd;
        if (start > stop) return;
        let d = new Date(start);
        let guard = 0;
        while (d <= stop && guard < 800) {
          guard++;
          const idx = (d.getDay() + 6) % 7;
          if (ev.weekdays.includes(idx)) {
            out.push({ sourceId: ev.id, title: ev.title, category: ev.category, date: new Date(d), start: ev.start, end: ev.end, recurring: true });
          }
          d = addDays(d, 1);
        }
      }
    });
    out.sort((a, b) => a.date - b.date || timeToMin(a.start) - timeToMin(b.start));
    return out;
  }

  function getDataRange() {
    let min = null, max = null;
    events.forEach(ev => {
      if (ev.type === 'single') {
        const d = parseDateStr(ev.date);
        if (!min || d < min) min = d;
        if (!max || d > max) max = d;
      } else {
        const a = parseDateStr(ev.anchorDate);
        const u = parseDateStr(ev.repeatUntil);
        if (!min || a < min) min = a;
        if (!max || u > max) max = u;
      }
    });
    return min && max ? { min, max } : null;
  }

  // ── 登録済み予定一覧 ──
  function renderEventList() {
    const area = document.getElementById('eventListArea');
    document.getElementById('eventCount').textContent = events.length;
    if (events.length === 0) {
      area.innerHTML = '<div class="empty-note">まだ予定が登録されていません</div>';
      return;
    }
    const sorted = [...events].sort((a, b) => {
      const da = a.type === 'single' ? a.date : a.anchorDate;
      const db = b.type === 'single' ? b.date : b.anchorDate;
      return da.localeCompare(db);
    });
    area.innerHTML = sorted.map(ev => {
      const cat = CATEGORIES[ev.category];
      let meta;
      if (ev.type === 'single') {
        const d = parseDateStr(ev.date);
        meta = `${d.getMonth() + 1}/${d.getDate()}(${WD_LABELS[(d.getDay() + 6) % 7]}) ${ev.start}〜${ev.end}`;
      } else {
        const wdText = ev.weekdays.slice().sort((a, b) => a - b).map(i => WD_LABELS[i]).join('・');
        const u = parseDateStr(ev.repeatUntil);
        meta = `毎週${wdText}曜 ${ev.start}〜${ev.end}（〜${u.getFullYear()}/${u.getMonth() + 1}/${u.getDate()}まで）`;
      }
      return `
        <div class="event-item">
          <span class="event-dot" style="background:${cat.color}"></span>
          <div class="event-item-body">
            <div class="event-item-title">${esc(ev.title)}</div>
            <div class="event-item-meta">${meta}</div>
          </div>
          <span class="event-item-tag">${cat.label}${ev.type === 'recurring' ? ' ・繰り返し' : ''}</span>
          <button class="btn-remove" onclick="deleteEvent(${ev.id})" title="削除">×</button>
        </div>`;
    }).join('');
  }

  // ── 集計（仕事カテゴリの週間・月間合計） ──
  function renderAggregation() {
    const range = getDataRange();
    const weeklyEl = document.getElementById('aggWeekly');
    const monthlyEl = document.getElementById('aggMonthly');
    if (!range) {
      weeklyEl.innerHTML = '<div class="empty-note">仕事の予定がまだありません</div>';
      monthlyEl.innerHTML = '<div class="empty-note">仕事の予定がまだありません</div>';
      return;
    }
    const occ = expandOccurrences(range.min, range.max).filter(o => o.category === 'work');
    if (occ.length === 0) {
      weeklyEl.innerHTML = '<div class="empty-note">仕事の予定がまだありません</div>';
      monthlyEl.innerHTML = '<div class="empty-note">仕事の予定がまだありません</div>';
      return;
    }

    const weekly = new Map();
    const monthly = new Map();
    occ.forEach(o => {
      const hours = (timeToMin(o.end) - timeToMin(o.start)) / 60;
      const mon = getMonday(o.date);
      const wKey = ymd(mon);
      const wEnd = addDays(mon, 6);
      const wLabel = `${mon.getMonth() + 1}/${mon.getDate()}〜${wEnd.getMonth() + 1}/${wEnd.getDate()}週`;
      weekly.set(wKey, { label: wLabel, key: wKey, hours: (weekly.get(wKey)?.hours || 0) + hours });

      const mKey = `${o.date.getFullYear()}-${pad2(o.date.getMonth() + 1)}`;
      const mLabel = `${o.date.getFullYear()}年${o.date.getMonth() + 1}月`;
      monthly.set(mKey, { label: mLabel, key: mKey, hours: (monthly.get(mKey)?.hours || 0) + hours });
    });

    const weeklyArr = [...weekly.values()].sort((a, b) => a.key.localeCompare(b.key));
    const monthlyArr = [...monthly.values()].sort((a, b) => a.key.localeCompare(b.key));

    weeklyEl.innerHTML = weeklyArr.map(w => `
      <div class="agg-row"><span>${w.label}</span><span class="agg-hours">${w.hours.toFixed(1)}時間</span></div>
    `).join('');
    monthlyEl.innerHTML = monthlyArr.map(m => `
      <div class="agg-row"><span>${m.label}</span><span class="agg-hours">${m.hours.toFixed(1)}時間</span></div>
    `).join('');
  }

  // ── 表示切り替え ──
  function setView(v) {
    activeView = v;
    document.getElementById('tabShift').classList.toggle('active', v === 'shift');
    document.getElementById('tabList').classList.toggle('active', v === 'list');
    document.getElementById('shiftView').style.display = v === 'shift' ? 'block' : 'none';
    document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
    renderAll();
  }

  // ── 週ナビ ──
  function shiftWeek(n) { currentWeekStart = addDays(currentWeekStart, 7 * n); renderShiftGrid(); }
  function jumpToday() { currentWeekStart = getMonday(new Date()); renderShiftGrid(); }

  // ── シフト表描画 ──
  function layoutDayEvents(dayOcc) {
    dayOcc.forEach(o => { o._start = timeToMin(o.start); o._end = timeToMin(o.end); });
    dayOcc.sort((a, b) => a._start - b._start);
    const lanesEnd = [];
    dayOcc.forEach(o => {
      let placed = false;
      for (let L = 0; L < lanesEnd.length; L++) {
        if (lanesEnd[L] <= o._start) { o._lane = L; lanesEnd[L] = o._end; placed = true; break; }
      }
      if (!placed) { o._lane = lanesEnd.length; lanesEnd.push(o._end); }
    });
    const totalLanes = Math.max(1, lanesEnd.length);
    dayOcc.forEach(o => { o._lanes = totalLanes; });
    return dayOcc;
  }

  function freeGaps(dayOcc) {
    const merged = [];
    [...dayOcc].sort((a, b) => a._start - b._start).forEach(o => {
      if (merged.length && o._start <= merged[merged.length - 1].end) {
        merged[merged.length - 1].end = Math.max(merged[merged.length - 1].end, o._end);
      } else {
        merged.push({ start: o._start, end: o._end });
      }
    });
    const gaps = [];
    let cursor = 0;
    merged.forEach(m => {
      if (m.start > cursor) gaps.push({ start: cursor, end: m.start });
      cursor = Math.max(cursor, m.end);
    });
    if (cursor < 1440) gaps.push({ start: cursor, end: 1440 });
    return gaps;
  }

  function renderShiftGrid() {
    const weekDates = [...Array(7)].map((_, i) => addDays(currentWeekStart, i));
    const weekEnd = weekDates[6];
    document.getElementById('weekRangeLabel').textContent =
      `${currentWeekStart.getFullYear()}/${currentWeekStart.getMonth() + 1}/${currentWeekStart.getDate()}(月) 〜 ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}(日)`;

    const occ = expandOccurrences(weekDates[0], weekDates[6]);
    const today = new Date();

    const headerHtml = `
      <div class="grid-cols">
        <div class="grid-corner"></div>
        ${weekDates.map((d, i) => `<div class="daycol-header ${isSameDate(d, today) ? 'is-today' : ''}">${WD_LABELS[i]}<br>${d.getMonth() + 1}/${d.getDate()}</div>`).join('')}
      </div>`;

    const hourLabelsHtml = [...Array(12)].map((_, h2) => {
      const h = h2 * 2;
      return `<div class="hour-label" style="top:${h * ROW_H}px">${h}:00</div>`;
    }).join('');

    const gridLineBg = `repeating-linear-gradient(to bottom, transparent 0, transparent ${ROW_H - 1}px, #eef0f4 ${ROW_H - 1}px, #eef0f4 ${ROW_H}px)`;

    const dayColsHtml = weekDates.map(d => {
      const dayOcc = occ.filter(o => isSameDate(o.date, d));
      layoutDayEvents(dayOcc);
      const gaps = freeGaps(dayOcc);

      const gapsHtml = gaps.map(g => {
        const h = (g.end - g.start) * PX_PER_MIN;
        const showLabel = h >= ROW_H * 2.2;
        return `<div class="slot-free" style="top:${g.start * PX_PER_MIN}px;height:${h}px;">${showLabel ? '<span class="free-label">空き</span>' : ''}</div>`;
      }).join('');

      const eventsHtml = dayOcc.map(o => {
        const cat = CATEGORIES[o.category];
        const top = o._start * PX_PER_MIN;
        const h = Math.max(15, (o._end - o._start) * PX_PER_MIN);
        const widthPct = 100 / o._lanes;
        const leftPct = o._lane * widthPct;
        const showTime = h >= 24;
        return `<div class="event-block" style="top:${top}px;height:${h}px;left:${leftPct}%;width:calc(${widthPct}% - 2px);background:${hexToRgba(cat.color, 0.88)};" title="${esc(o.title)} ${o.start}〜${o.end}">
          <div class="eb-title">${esc(o.title)}</div>
          ${showTime ? `<div class="eb-time">${o.start}〜${o.end}</div>` : ''}
        </div>`;
      }).join('');

      return `<div class="day-col" style="height:${TOTAL_H}px;background-image:${gridLineBg}">${gapsHtml}${eventsHtml}</div>`;
    }).join('');

    const bodyHtml = `
      <div class="grid-cols" style="align-items:stretch;">
        <div class="hour-axis" style="height:${TOTAL_H}px">${hourLabelsHtml}</div>
        ${dayColsHtml}
      </div>`;

    document.getElementById('shiftGridArea').innerHTML = headerHtml + bodyHtml;
  }

  // ── スケジュール帳（リスト）描画 ──
  function renderScheduleList() {
    const area = document.getElementById('scheduleListArea');
    const range = getDataRange();
    if (!range) {
      area.innerHTML = '<div class="list-empty">まだ予定が登録されていません。上のフォームから予定を追加してください。</div>';
      return;
    }
    const occ = expandOccurrences(range.min, range.max);
    if (occ.length === 0) {
      area.innerHTML = '<div class="list-empty">表示できる予定がありません</div>';
      return;
    }
    const today = new Date();
    const groups = new Map();
    occ.forEach(o => {
      const key = ymd(o.date);
      if (!groups.has(key)) groups.set(key, { date: o.date, items: [] });
      groups.get(key).items.push(o);
    });
    const sortedGroups = [...groups.values()].sort((a, b) => a.date - b.date);

    area.innerHTML = sortedGroups.map(g => {
      const wd = WD_LABELS[(g.date.getDay() + 6) % 7];
      const isToday = isSameDate(g.date, today);
      const itemsHtml = g.items.map(o => {
        const cat = CATEGORIES[o.category];
        return `
          <div class="list-event-row">
            <span class="list-event-time">${o.start}〜${o.end}</span>
            <span class="list-event-dot" style="background:${cat.color}"></span>
            <span class="list-event-title">${esc(o.title)}<span class="list-event-cat">（${cat.label}${o.recurring ? '・繰り返し' : ''}）</span></span>
          </div>`;
      }).join('');
      return `
        <div class="list-date-group">
          <div class="list-date-head ${isToday ? 'is-today' : ''}">
            ${g.date.getFullYear()}/${g.date.getMonth() + 1}/${g.date.getDate()}（${wd}）
            ${isToday ? '<span class="today-chip">今日</span>' : ''}
          </div>
          ${itemsHtml}
        </div>`;
    }).join('');
  }

  function renderAll() {
    renderEventList();
    renderAggregation();
    if (activeView === 'shift') renderShiftGrid();
    else renderScheduleList();
  }

  // ── リセット ──
  function resetAll() {
    if (!confirm('登録した予定をすべてリセットしますか？')) return;
    events = [];
    renderAll();
  }

  // ── 初期化（デモ用のサンプル予定） ──
  function initDefaults() {
    document.getElementById('evDate').value = ymd(new Date());
    const monday = getMonday(new Date());
    events.push({ id: nextId++, type: 'recurring', title: 'オフィス勤務', category: 'work', anchorDate: ymd(monday), start: '09:00', end: '18:00', weekdays: [0, 1, 2, 3, 4], repeatUntil: ymd(addDays(monday, 56)) });
    events.push({ id: nextId++, type: 'single', title: 'プロジェクト会議', category: 'important', date: ymd(addDays(monday, 1)), start: '14:00', end: '15:30' });
    events.push({ id: nextId++, type: 'single', title: '歯医者', category: 'private', date: ymd(addDays(monday, 4)), start: '19:00', end: '20:00' });
    renderAll();
  }

  initDefaults();
</script>
</body>
