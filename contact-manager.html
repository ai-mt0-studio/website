<style>

  .contact-item.urgency-soon .contact-item-followup { color: var(--orange-400); }

  .topbar {
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(6,6,26,0.6);
    backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;

  /* ダッシュボード */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
  .kpi {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px;
    padding: 1rem; text-align: center;
  }

  .kpi-value.purple { color: var(--purple-400); }
  .kpi-value.blue { color: var(--blue-300); }
  .kpi-value.red { color: var(--red-400); }
  .kpi-value.orange { color: var(--orange-400); }

  .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
  .section-bar { width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(var(--purple-700), var(--blue-700)); }

  .recent-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
  .recent-item {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px;
    padding: 0.65rem 0.85rem; display: flex; align-items: center; gap: 0.75rem;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit; width: 100%; text-align: left; color: var(--text);

  }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.4; }

  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .detail-heading { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.3rem; }
  .detail-sub { font-size: 0.8rem; color: var(--muted); }
  .badge {

    border-radius: 999px; margin-top: 0.4rem;

  .badge-overdue { background: rgba(248,113,113,0.15); color: var(--red-400); border: 1px solid rgba(248,113,113,0.3); }
  .badge-soon { background: rgba(251,146,60,0.15); color: var(--orange-400); border: 1px solid rgba(251,146,60,0.3); }
  .badge-none { background: rgba(148,163,184,0.12); color: var(--muted); border: 1px solid rgba(148,163,184,0.2); }

  .save-indicator { font-size: 0.7rem; color: var(--green-400); opacity: 0; transition: opacity 0.3s; }
  .save-indicator.show { opacity: 1; }

  .card { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 14px; padding: 1.1rem; margin-bottom: 1.25rem; }

  .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.85rem; }
  .form-group label { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  .form-grid .form-group.full { grid-column: 1 / -1; }

  input[type=text], input[type=search], input[type=email], input[type=date], select, textarea {
    width: 100%; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 0.65rem 0.9rem; color: var(--text);
    font-size: 0.88rem; font-family: inherit; outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    color-scheme: dark;
  }
  body.light input[type=text], body.light input[type=search], body.light input[type=email],
  body.light input[type=date], body.light select, body.light textarea {
    border-color: rgba(0,0,0,0.12); color-scheme: light;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--purple-700); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  input::placeholder, textarea::placeholder { color: rgba(148,163,184,0.45); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.6; }

  /* 履歴 */
  .history-add { display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1rem; }
  .history-add .form-group { margin-bottom: 0; flex: 1; min-width: 160px; }
  .history-add .form-group.grow { flex: 3; min-width: 220px; }

  .history-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .history-item {
    background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px;

  }
  body.light .history-item { background: rgba(0,0,0,0.03); }
  .history-date {
    font-size: 0.72rem; font-weight: 700; color: var(--purple-400); white-space: nowrap;
    background: rgba(124,58,237,0.12); border-radius: 8px; padding: 0.3rem 0.5rem; flex-shrink: 0;
  }
  .history-note { font-size: 0.85rem; line-height: 1.6; flex: 1; white-space: pre-wrap; word-break: break-word; }
  .history-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; flex-shrink: 0; }
  .history-del:hover { color: var(--red-400); }

  /* トースト */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--green-400); color: #fff; border-radius: 999px;
    padding: 0.65rem 1.5rem; font-size: 0.85rem; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: transform 0.3s; z-index: 200;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* モバイル対応 */
  .menu-btn { display: none; }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49;
    border: none; padding: 0; cursor: default;
    -webkit-appearance: none; appearance: none;
  }

  @media(max-width: 768px) {
    .sidebar { position: fixed; left: 0; top: 0; height: 100vh; z-index: 50; transform: translateX(-100%); width: 85vw; max-width: 320px; }

    .sidebar-overlay.show { display: block; }
    .menu-btn { display: flex; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .history-add { flex-direction: column; align-items: stretch; }
  }

</div>

<!-- ===== インポート/エクスポート ===== -->
<div class="modal-overlay" id="importExportModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(8px); z-index:100; align-items:center; justify-content:center; padding:1rem;">
  <div class="modal" style="background:#0d0d2b; border:1px solid rgba(124,58,237,0.3); border-radius:20px; padding:1.5rem; width:100%; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="font-size:1rem;font-weight:800;margin-bottom:1.25rem;">📤 インポート / エクスポート</div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;margin-bottom:1rem">
      <button class="btn btn-ghost" onclick="exportData()" style="width:100%;text-align:left;padding:0.85rem 1rem">📥 JSONエクスポート（バックアップ）</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()" style="width:100%;text-align:left;padding:0.85rem 1rem">📤 JSONインポート（復元）</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
      <button class="btn btn-danger btn-sm" onclick="clearAllData()" style="width:100%">🗑 全データを削除する</button>
    </div>
    <div style="display:flex;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="hideModal('importExportModal')">閉じる</button>
    </div>
  </div>
</div>

<script>
  // ── データ ──
  let contacts = JSON.parse(localStorage.getItem('cm_contacts') || '[]');
  let currentId = null;
  let currentFilter = 'all';
  let searchQuery = '';
  let isLight = localStorage.getItem('cm_theme') === 'light';

  if (isLight) document.body.classList.add('light');

  function save() {
    localStorage.setItem('cm_contacts', JSON.stringify(contacts));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function fmtDate(s) {
    if (!s) return '';
    const [y,m,d] = s.split('-');
    return `${y}/${Number(m)}/${Number(d)}`;
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const today = new Date(todayStr() + 'T00:00:00');
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function urgencyOf(c) {
    const d = daysUntil(c.nextFollowUpDate);
    if (d === null) return 'none';
    if (d < 0) return 'overdue';
    if (d <= 7) return 'soon';
    return 'normal';
  }

  function lastContactDate(c) {
    if (!c.history || !c.history.length) return c.firstContactDate || '';
    return c.history.reduce((max, h) => (!max || h.date > max) ? h.date : max, '');
  }

  // ── テーマ ──
  function toggleTheme() {
    isLight = !isLight;
    document.body.classList.toggle('light', isLight);
    document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
    localStorage.setItem('cm_theme', isLight ? 'light' : 'dark');
  }
  if (isLight) document.getElementById('themeBtn').textContent = '☀️';

  // ── サイドバー（モバイル） ──
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }

  // ── フィルター/検索 ──
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    renderList();
  }

  function getFilteredContacts() {
    let list = [...contacts];
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(c =>
        (c.name||'').toLowerCase().includes(q) ||
        (c.company||'').toLowerCase().includes(q)
      );
    }
    if (currentFilter === 'soon') list = list.filter(c => urgencyOf(c) === 'soon' || urgencyOf(c) === 'overdue');
    if (currentFilter === 'overdue') list = list.filter(c => urgencyOf(c) === 'overdue');

    list.sort((a, b) => {
      const da = daysUntil(a.nextFollowUpDate);
      const db = daysUntil(b.nextFollowUpDate);
      if (da === null && db === null) return (a.company||a.name||'').localeCompare(b.company||b.name||'', 'ja');
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });
    return list;
  }

  // ── サイドバー一覧 描画 ──
  function renderList() {
    searchQuery = document.getElementById('searchInput').value;
    const list = getFilteredContacts();
    document.getElementById('listCountLabel').textContent = `会社一覧（${contacts.length}件）`;

    const el = document.getElementById('contactList');
    if (!list.length) {
      el.innerHTML = `<div style="color:var(--muted);font-size:0.8rem;padding:1rem 0.25rem;text-align:center;">該当する登録がありません</div>`;
      return;
    }
    el.innerHTML = list.map(c => {
      const urgency = urgencyOf(c);
      const d = daysUntil(c.nextFollowUpDate);
      let followLabel = '未設定';
      if (urgency === 'overdue') followLabel = `${fmtDate(c.nextFollowUpDate)}（${Math.abs(d)}日超過）`;
      else if (urgency === 'soon') followLabel = `${fmtDate(c.nextFollowUpDate)}（あと${d}日）`;
      else if (urgency === 'normal') followLabel = fmtDate(c.nextFollowUpDate);

      const label = c.company
        ? (c.name ? `${c.company}（${c.name}）` : c.company)
        : (c.name || '（名称未設定）');
      const last = lastContactDate(c);
      const lastLabel = last ? '最終: ' + fmtDate(last) : '未接触';

      return `<button class="contact-item urgency-${urgency}${c.id===currentId?' active':''}" onclick="selectContact('${c.id}')">
        <div class="contact-item-name">${esc(label)}</div>
        <div class="contact-item-sub">
          <span>${esc(lastLabel)}</span>
          <span class="contact-item-followup">次回: ${esc(followLabel)}</span>
        </div>
      </button>`;
    }).join('');
  }

  // ── ダッシュボード ──
  function renderDashboard() {
    document.getElementById('topbarTitle').textContent = 'ダッシュボード';
    document.getElementById('topbarCount').textContent = `全${contacts.length}件`;
    document.getElementById('topbarActions').innerHTML = '';

    const total = contacts.length;
    const overdue = contacts.filter(c => urgencyOf(c) === 'overdue').length;
    const soon = contacts.filter(c => urgencyOf(c) === 'soon').length;
    const none = contacts.filter(c => urgencyOf(c) === 'none').length;

    const upcoming = contacts
      .filter(c => c.nextFollowUpDate)
      .sort((a,b) => a.nextFollowUpDate.localeCompare(b.nextFollowUpDate))
      .slice(0, 8);

    const recentHistory = contacts
      .flatMap(c => (c.history||[]).map(h => ({ ...h, contactId: c.id, label: c.company || c.name || '（名称未設定）' })))
      .sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0) - (a.createdAt||0))
      .slice(0, 8);

    document.getElementById('content').innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">登録数</div><div class="kpi-value purple">${total}</div></div>
        <div class="kpi"><div class="kpi-label">期限超過</div><div class="kpi-value red">${overdue}</div></div>
        <div class="kpi"><div class="kpi-label">7日以内</div><div class="kpi-value orange">${soon}</div></div>
        <div class="kpi"><div class="kpi-label">予定未設定</div><div class="kpi-value blue">${none}</div></div>
      </div>

      <div class="section-title"><div class="section-bar"></div>📅 フォローアップ予定</div>
      <div class="recent-list" id="upcomingList"></div>

      <div class="section-title"><div class="section-bar"></div>🕘 最近のやり取り</div>
      <div class="recent-list" id="recentHistoryList"></div>
    `;

    const upcomingEl = document.getElementById('upcomingList');
    upcomingEl.innerHTML = upcoming.length
      ? upcoming.map(c => {
          const urgency = urgencyOf(c);
          const d = daysUntil(c.nextFollowUpDate);
          const metaText = urgency === 'overdue' ? `${Math.abs(d)}日超過` : (d === 0 ? '本日' : `あと${d}日`);
          return `<button class="recent-item" onclick="selectContact('${c.id}')">
            <div class="recent-title">${esc(c.company || c.name || '（名称未設定）')}</div>
            <div class="recent-meta" style="color:${urgency==='overdue'?'var(--red-400)':(urgency==='soon'?'var(--orange-400)':'var(--muted)')}">${fmtDate(c.nextFollowUpDate)}（${metaText}）</div>
          </button>`;
        }).join('')
      : '<div style="color:var(--muted);font-size:0.82rem;padding:0.5rem">フォローアップ予定はまだありません</div>';

    const historyEl = document.getElementById('recentHistoryList');
    historyEl.innerHTML = recentHistory.length
      ? recentHistory.map(h => `<button class="recent-item" onclick="selectContact('${h.contactId}')">
            <div class="recent-sub">${esc(h.label)}：${esc(h.note)}</div>
            <div class="recent-meta">${fmtDate(h.date)}</div>
          </button>`).join('')
      : '<div style="color:var(--muted);font-size:0.82rem;padding:0.5rem">やり取りの履歴はまだありません</div>';

    if (!contacts.length) {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📇</div>
          <div class="empty-title">まだ登録がありません</div>
          <div class="empty-desc">左下の「＋ 新規登録」から、名刺交換した相手を登録してみましょう</div>
        </div>`;
    }
  }

  // ── 会社詳細 ──
  function selectContact(id) {
    currentId = id;
    renderList();
    renderDetail();
    closeSidebar();
  }

  function goDashboard() {
    currentId = null;
    renderList();
    renderDashboard();
    closeSidebar();
  }

  function renderDetail() {
    const c = contacts.find(x => x.id === currentId);
    if (!c) { currentId = null; renderDashboard(); return; }

    document.getElementById('topbarTitle').textContent = c.company || c.name || '（名称未設定）';
    document.getElementById('topbarCount').textContent = '';
    document.getElementById('topbarActions').innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="goDashboard()">← ダッシュボードへ</button>
      <button class="btn btn-danger btn-sm" onclick="deleteContact('${c.id}')">🗑 削除</button>
    `;

    const urgency = urgencyOf(c);
    const badgeClass = urgency === 'overdue' ? 'badge-overdue' : (urgency === 'soon' ? 'badge-soon' : 'badge-none');
    const d = daysUntil(c.nextFollowUpDate);
    let badgeText = 'フォローアップ予定未設定';
    if (urgency === 'overdue') badgeText = `⚠️ フォローアップ ${Math.abs(d)}日超過`;
    else if (urgency === 'soon') badgeText = `⏰ フォローアップまであと${d}日`;
    else if (urgency === 'normal') badgeText = `📅 次回フォローアップ: ${fmtDate(c.nextFollowUpDate)}`;

    document.getElementById('content').innerHTML = `
      <div class="detail-header">
        <div>
          <div class="detail-heading">${esc(c.company || c.name || '（名称未設定）')}</div>
          <div class="detail-sub">最終接触日: ${lastContactDate(c) ? esc(fmtDate(lastContactDate(c))) : '未接触'}</div>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="save-indicator" id="saveIndicator">✓ 保存しました</div>
      </div>

      <div class="card">
        <div class="form-grid">
          <div class="form-group">
            <label>名前（担当者）</label>
            <input type="text" id="fName" value="${escAttr(c.name)}" placeholder="例：山田 太郎" oninput="updateField('name', this.value)" />
          </div>
          <div class="form-group">
            <label>会社名</label>
            <input type="text" id="fCompany" value="${escAttr(c.company)}" placeholder="例：株式会社サンプル" oninput="updateField('company', this.value)" />
          </div>
          <div class="form-group">
            <label>業種</label>
            <input type="text" id="fIndustry" value="${escAttr(c.industry)}" placeholder="例：製造業、IT、小売業" oninput="updateField('industry', this.value)" />
          </div>
          <div class="form-group">
            <label>連絡先（任意）</label>
            <input type="text" id="fContact" value="${escAttr(c.contact)}" placeholder="例：mail@example.com" oninput="updateField('contact', this.value)" />
          </div>
          <div class="form-group">
            <label>出会った日 / 初回接触日</label>
            <input type="date" id="fFirstDate" value="${escAttr(c.firstContactDate)}" onchange="updateField('firstContactDate', this.value)" />
          </div>
          <div class="form-group">
            <label>次回フォローアップ予定日</label>
            <input type="date" id="fFollowDate" value="${escAttr(c.nextFollowUpDate)}" onchange="updateField('nextFollowUpDate', this.value)" />
          </div>
        </div>
      </div>

      <div class="section-title"><div class="section-bar"></div>やり取りの履歴</div>
      <div class="card">
        <div class="history-add">
          <div class="form-group">
            <label>日付</label>
            <input type="date" id="hDate" value="${escAttr(todayStr())}" />
          </div>
          <div class="form-group grow">
            <label>内容</label>
            <input type="text" id="hNote" placeholder="例：名刺交換、メールでフォローアップ、商談 など" onkeydown="if(event.key==='Enter'){addHistory();}" />
          </div>
          <button class="btn btn-primary" onclick="addHistory()">＋ 履歴を追加</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    `;

    renderHistoryList(c);
  }

  function renderHistoryList(c) {
    const list = [...(c.history||[])].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0) - (a.createdAt||0));
    const el = document.getElementById('historyList');
    el.innerHTML = list.length
      ? list.map(h => `<div class="history-item">
          <div class="history-date">${esc(fmtDate(h.date))}</div>
          <div class="history-note">${esc(h.note)}</div>
          <button class="history-del" onclick="deleteHistory('${h.id}')" title="削除">🗑</button>
        </div>`).join('')
      : '<div style="color:var(--muted);font-size:0.82rem;padding:0.5rem">まだ履歴がありません</div>';
  }

  // ── 会社の作成・更新・削除 ──
  function createContact() {
    if (contacts.length >= 100) { alert('登録できるのは最大100社までです。'); return; }
    const c = {
      id: 'c' + Date.now() + Math.random().toString(36).slice(2,7),
      name: '', company: '', industry: '', contact: '',
      firstContactDate: todayStr(), nextFollowUpDate: '',
      history: [], createdAt: Date.now(), updatedAt: Date.now()
    };
    contacts.unshift(c);
    save();
    currentId = c.id;
    renderList();
    renderDetail();
    const el = document.getElementById('fCompany');
    if (el) el.focus();
  }

  function updateField(field, value) {
    const c = contacts.find(x => x.id === currentId);
    if (!c) return;
    c[field] = value;
    c.updatedAt = Date.now();
    save();
    renderList();
    if (field === 'nextFollowUpDate' || field === 'company' || field === 'name') {
      document.getElementById('topbarTitle').textContent = c.company || c.name || '（名称未設定）';
    }
    flashSaveIndicator();
  }

  function deleteContact(id) {
    if (!confirm('この登録を削除しますか？履歴もすべて削除されます。')) return;
    contacts = contacts.filter(c => c.id !== id);
    save();
    if (currentId === id) { currentId = null; renderDashboard(); }
    renderList();
  }

  let saveFlashTimer;
  function flashSaveIndicator() {
    const el = document.getElementById('saveIndicator');
    if (!el) return;
    el.classList.add('show');
    clearTimeout(saveFlashTimer);
    saveFlashTimer = setTimeout(() => el.classList.remove('show'), 1200);
  }

  // ── 履歴 操作 ──
  function addHistory() {
    const c = contacts.find(x => x.id === currentId);
    if (!c) return;
    const date = document.getElementById('hDate').value || todayStr();
    const note = document.getElementById('hNote').value.trim();
    if (!note) { alert('やり取りの内容を入力してください'); return; }
    c.history = c.history || [];
    c.history.push({ id: 'h' + Date.now() + Math.random().toString(36).slice(2,7), date, note, createdAt: Date.now() });
    c.updatedAt = Date.now();
    save();
    document.getElementById('hNote').value = '';
    document.getElementById('hDate').value = todayStr();
    renderHistoryList(c);
    renderList();
    document.querySelector('.detail-sub').textContent = '最終接触日: ' + fmtDate(lastContactDate(c));
  }

  function deleteHistory(hid) {
    const c = contacts.find(x => x.id === currentId);
    if (!c) return;
    if (!confirm('この履歴を削除しますか？')) return;
    c.history = (c.history||[]).filter(h => h.id !== hid);
    save();
    renderHistoryList(c);
    renderList();
    document.querySelector('.detail-sub').textContent = '最終接触日: ' + (lastContactDate(c) ? fmtDate(lastContactDate(c)) : '未接触');
  }

  // ── インポート/エクスポート ──
  function exportData() {
    const data = JSON.stringify({ contacts }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `contact_manager_backup_${todayStr()}.json`;
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (Array.isArray(d.contacts)) contacts = d.contacts.slice(0, 100);
        save();
        currentId = null;
        renderList();
        renderDashboard();
        alert('インポートしました！');
        hideModal('importExportModal');
      } catch { alert('ファイルの形式が正しくありません'); }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function clearAllData() {
    if (!confirm('全てのデータを削除しますか？この操作は元に戻せません。')) return;
    contacts = [];
    save();
    currentId = null;
    renderList();
    renderDashboard();
    hideModal('importExportModal');
  }

  // ── モーダル ──
  function showModal(id) { document.getElementById(id).style.display = 'flex'; }
  function hideModal(id) { document.getElementById(id).style.display = 'none'; }
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.style.display = 'none'; });
  });

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) { return esc(s); }

  // ── 初期化 ──
  renderList();
  renderDashboard();
</script>

<div class="share-prompt" style="max-width:640px;margin:32px auto 0;padding:22px 26px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);text-align:center;">
  <p style="margin:0 0 14px;font-size:0.9rem;color:#c8cee0;">このツールが役に立ったら、SNSでシェアしてください</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
    <button type="button" data-share="x" style="padding:10px 22px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#fff;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;">𝕏 でシェア</button>
    <button type="button" data-share="threads" style="padding:10px 22px;border-radius:10px;border:1px solid rgba(167,139,250,0.4);background:rgba(167,139,250,0.14);color:#c4b5fd;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;">Threads でシェア</button>
  </div>
</div>
<script src="share.js"></script>
</body>
</html>
