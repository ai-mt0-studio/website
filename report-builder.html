<style>

<div class="container">

    <h1>📊 資料作成ツール（グラフ付き月次・週次レポート）</h1>

      <button type="button" class="type-btn active" id="btnMonthly" onclick="setReportType('monthly')">🗓 月次レポート</button>

  <!-- タイトル・期間 -->
  <div class="card">

      <div class="form-group" style="grid-column: 1 / -1;">
        <label>タイトル</label>
        <input type="text" id="reportTitle" placeholder="例：7月度 営業報告" oninput="render()" />
      </div>
      <div class="form-group">

        <input type="text" id="reportPeriod" placeholder="例：2026年7月1日〜7月31日" oninput="render()" />
      </div>
      <div class="form-group">
        <label>作成者名（任意）</label>
        <input type="text" id="reportAuthor" placeholder="例：営業部 山田" oninput="render()" />
      </div>
    </div>
  </div>

  <!-- 数値項目 -->
  <div class="card">
    <div class="label"><div class="label-bar"></div>主要な数値項目</div>

    <button class="btn-add" id="btnAddItem" onclick="addItem()">＋ 項目を追加</button>

      <button type="button" class="chart-type-btn active" id="btnBar" onclick="setChartType('bar')">📊 棒グラフ</button>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script>
  const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4'];
  const MAX_ITEMS = PALETTE.length;

  let reportType = 'monthly';
  let chartType = 'bar';
  let items = [];
  let comments = [];
  let chartInstance = null;

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── レポート種別 ──
  function setReportType(t) {
    reportType = t;
    document.getElementById('btnMonthly').classList.toggle('active', t === 'monthly');
    document.getElementById('btnWeekly').classList.toggle('active', t === 'weekly');
    render();
  }

  // ── グラフ種類 ──
  function setChartType(t) {
    chartType = t;
    document.getElementById('btnBar').classList.toggle('active', t === 'bar');
    document.getElementById('btnPie').classList.toggle('active', t === 'pie');
    render();
  }

  // ── 数値項目 ──
  function addItem(name, value) {
    if (items.length >= MAX_ITEMS) return;
    items.push({ name: name || '', value: value === undefined ? '' : value });
    renderItemRows();
    render();
  }

  function removeItem(idx) {
    if (items.length === 1) {
      items[0] = { name: '', value: '' };
    } else {
      items.splice(idx, 1);
    }
    renderItemRows();
    render();
  }

  function renderItemRows() {
    const list = document.getElementById('itemList');
    list.innerHTML = items.map((it, i) => `
      <div class="item-row">
        <span class="item-swatch" style="background:${PALETTE[i]}"></span>
        <input type="text" class="item-name" placeholder="例：売上（万円）" value="${esc(it.name)}"
          oninput="items[${i}].name=this.value;render()" />
        <input type="number" class="item-value" placeholder="0" value="${esc(it.value)}"
          oninput="items[${i}].value=this.value;render()" />
        <button class="btn-remove" onclick="removeItem(${i})" title="削除">×</button>
      </div>
    `).join('');
    document.getElementById('btnAddItem').disabled = items.length >= MAX_ITEMS;
  }

  // ── コメント ──
  function addComment(label, body) {
    comments.push({ label: label !== undefined ? label : '', body: body || '' });
    renderCommentBlocks();
    render();
  }

  function removeComment(idx) {
    if (comments.length === 1) {
      comments[0] = { label: comments[0].label, body: '' };
    } else {
      comments.splice(idx, 1);
    }
    renderCommentBlocks();
    render();
  }

  function renderCommentBlocks() {
    const list = document.getElementById('commentList');
    list.innerHTML = comments.map((c, i) => `
      <div class="comment-block">
        <div class="comment-block-head">
          <input type="text" placeholder="見出し（例：総括・所感）" value="${esc(c.label)}"
            oninput="comments[${i}].label=this.value;render()" />
          <button class="btn-remove" onclick="removeComment(${i})" title="削除">×</button>
        </div>
        <textarea placeholder="コメント・所感を入力してください" oninput="comments[${i}].body=this.value;render()">${esc(c.body)}</textarea>
      </div>
    `).join('');
  }

  // ── プレビュー描画 ──
  function fmtNum(v) {
    const n = Number(v);
    return isNaN(n) ? 0 : n;
  }

  function render() {
    const title = document.getElementById('reportTitle').value.trim();
    const period = document.getElementById('reportPeriod').value.trim();
    const author = document.getElementById('reportAuthor').value.trim();
    const badgeText = reportType === 'monthly' ? '月次レポート' : '週次レポート';

    const validItems = items
      .map((it, i) => ({ name: it.name.trim(), value: fmtNum(it.value), color: PALETTE[i] }))
      .filter(it => it.name);

    const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

    const statCardsHtml = validItems.length ? `
      <div class="stat-grid">
        ${validItems.map(it => `
          <div class="stat-card" style="--stat-color:${it.color}">
            <div class="stat-name"><span class="stat-dot"></span>${esc(it.name)}</div>
            <div class="stat-num">${it.value.toLocaleString('ja-JP')}</div>
          </div>
        `).join('')}
      </div>` : '';

    const commentsHtml = comments.map(c => {
      const label = c.label.trim() || 'コメント';
      const body = c.body.trim();
      return `
        <div class="comment-preview">
          <div class="c-label">${esc(label)}</div>
          <div class="c-body ${body ? '' : 'empty'}">${body ? esc(body).replace(/\n/g, '<br>') : '（未入力）'}</div>
        </div>`;
    }).join('');

    document.getElementById('previewArea').innerHTML = `
      <div class="preview-period">${esc(period)}</div>
      <span class="preview-badge">${badgeText}</span>
      <div class="preview-title ${title ? '' : 'preview-empty-title'}">${title ? esc(title) : 'タイトル未入力'}</div>
      <div class="preview-generated">作成日：${today}${author ? ' ／ 作成者：' + esc(author) : ''}</div>

      <div class="preview-section-title">📊 数値サマリー</div>
      <div class="chart-area">
        ${validItems.length ? '<canvas id="reportChart"></canvas>' : '<div class="chart-empty">数値項目に「項目名」と「数値」を入力するとグラフが表示されます</div>'}
      </div>
      ${statCardsHtml}

      <div class="preview-section-title">📝 コメント・所感</div>
      ${commentsHtml || '<div class="c-body empty">コメント欄が入力されていません</div>'}
    `;

    drawChart(validItems);
  }

  function drawChart(validItems) {
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    if (!validItems.length) return;

    const canvas = document.getElementById('reportChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const labels = validItems.map(it => it.name);
    const values = validItems.map(it => it.value);
    const colors = validItems.map(it => it.color);

    if (chartType === 'bar') {
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 4, maxBarThickness: 64 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1a1a2e' } },
          scales: {
            x: { ticks: { color: '#52514e' }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: '#52514e' }, grid: { color: '#eef0f4' } }
          }
        }
      });
    } else {
      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#fff', borderWidth: 2 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#333', boxWidth: 12, padding: 14 } }, tooltip: { backgroundColor: '#1a1a2e' } }
        }
      });
    }
  }

  // ── リセット ──
  function resetAll() {
    if (!confirm('入力内容をリセットしますか？')) return;
    document.getElementById('reportTitle').value = '';
    document.getElementById('reportPeriod').value = '';
    document.getElementById('reportAuthor').value = '';
    setReportType('monthly');
    setChartType('bar');
    items = [];
    comments = [];
    initDefaults();
  }

  // ── 初期化 ──
  function initDefaults() {
    addItem('', '');
    addItem('', '');
    addItem('', '');
    addComment('総括・所感', '');
    addComment('来月に向けて', '');
    render();
  }

  initDefaults();
</script>
</body>
</html>
